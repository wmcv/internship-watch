name: Internship Watcher

# Primary trigger is workflow_dispatch, fired by an external pinger (cron-job.org
# / Cloudflare Worker). Dispatched runs skip GitHub's scheduled-event queue, which
# was adding a median 16 min of delay and silently dropping ~58% of runs.
# The schedule below is only a backstop for when the pinger is down.
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

# Serialize runs: every run commits state, so overlapping runs race on the push.
concurrency:
  group: internship-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Notify heartbeat monitor that the run started
        env:
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
        run: |
          test -z "$HEARTBEAT_URL" || \
            curl -fsS --retry 3 --max-time 10 "${HEARTBEAT_URL%/}/start"

      - name: Checkout this repo
        uses: actions/checkout@v4

      # Fetched in parallel: the off-season board is ~1 MB and dominates the
      # wall time, so overlapping the two saves most of the smaller fetch.
      - name: Fetch Simplify 2026 and 2027 boards
        run: |
          mkdir -p snapshots
          pids=()
          for year in 2026 2027; do
            base="https://raw.githubusercontent.com/SimplifyJobs/Summer${year}-Internships/dev"
            curl -sSf --retry 3 --retry-delay 2 --max-time 30 \
              "$base/README.md" -o "current-main-${year}.md" &
            pids+=("$!")
            curl -sSf --retry 3 --retry-delay 2 --max-time 30 \
              "$base/README-Off-Season.md" -o "current-offseason-${year}.md" &
            pids+=("$!")
          done
          failed=0
          for pid in "${pids[@]}"; do
            wait "$pid" || failed=1
          done
          test "$failed" -eq 0 || { echo "one or more Simplify board fetches failed"; exit 1; }
          wc -c current-main-*.md current-offseason-*.md

      - name: Test watcher filters and parser
        run: python3 -m unittest discover -s .github/workflow-scripts -p 'test_*.py'

      - name: Parse Simplify boards and build email
        id: simplify
        run: python3 .github/workflow-scripts/parse_boards.py

      - name: Send Simplify email if new rows found
        if: steps.simplify.outputs.total != '0'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ${{ steps.simplify.outputs.subject }}
          to: ${{ secrets.MAIL_TO }}
          from: Internship Watcher
          html_body: ${{ steps.simplify.outputs.html_body }}
          body: ${{ steps.simplify.outputs.plain_body }}

      # Runs even if the Simplify half failed — the two sources are independent,
      # and a bad fetch upstream shouldn't cost us the ATS poll.
      - name: Poll ATS boards and build email
        id: ats
        if: ${{ !cancelled() }}
        run: python3 .github/workflow-scripts/ats_watcher.py

      - name: Send ATS email if new roles found
        if: ${{ !cancelled() && steps.ats.outputs.total != '' && steps.ats.outputs.total != '0' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ${{ steps.ats.outputs.subject }}
          to: ${{ secrets.MAIL_TO }}
          from: Internship Watcher (ATS)
          html_body: ${{ steps.ats.outputs.html_body }}
          body: ${{ steps.ats.outputs.plain_body }}

      - name: Warn if ATS boards failed
        if: ${{ !cancelled() && steps.ats.outputs.new_failed_count != '' && steps.ats.outputs.new_failed_count != '0' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: Internship Watcher warning — ${{ steps.ats.outputs.new_failed_count }} ATS boards newly failing
          to: ${{ secrets.MAIL_TO }}
          from: Internship Watcher Health
          body: |
            The watcher completed, but these ATS boards started failing:
            ${{ steps.ats.outputs.new_failed_names }}

            The next scheduled run will retry them automatically.
            Logs: https://github.com/wmcv/internship-watch/actions/runs/${{ github.run_id }}

      - name: Save Simplify snapshots for next run
        if: ${{ !cancelled() && steps.simplify.outcome == 'success' }}
        run: |
          cp current-main-2026.md snapshots/previous-main-2026.md
          cp current-offseason-2026.md snapshots/previous-offseason-2026.md
          cp current-main-2027.md snapshots/previous-main.md
          cp current-offseason-2027.md snapshots/previous-offseason.md

      # One workflow owning all four state files means one commit and one push,
      # so the two watchers can no longer collide on rebase.
      - name: Commit updated state
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add snapshots/previous-main.md snapshots/previous-offseason.md \
                  snapshots/previous-main-2026.md snapshots/previous-offseason-2026.md \
                  snapshots/seen.json snapshots/ats-seen.json snapshots/ats-failures.json
          git diff --staged --quiet && exit 0
          git commit -m "Update watcher state"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "push attempt $attempt failed; retrying"
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "could not push after 3 attempts"; exit 1

      - name: Email fatal workflow failure
        if: ${{ failure() }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: Internship Watcher failed
          to: ${{ secrets.MAIL_TO }}
          from: Internship Watcher Health
          body: |
            The internship watcher failed before completing all checks.
            Review the run: https://github.com/wmcv/internship-watch/actions/runs/${{ github.run_id }}

      - name: Report final status to heartbeat monitor
        if: ${{ always() }}
        env:
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
          JOB_STATUS: ${{ job.status }}
        run: |
          test -z "$HEARTBEAT_URL" && exit 0
          if test "$JOB_STATUS" = "success"; then
            curl -fsS --retry 3 --max-time 10 "${HEARTBEAT_URL%/}"
          else
            curl -fsS --retry 3 --max-time 10 "${HEARTBEAT_URL%/}/fail"
          fi
